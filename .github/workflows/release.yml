name: release

# Cut a release on any v* tag: cross-compiled binaries + SHA256SUMS.
# The Homebrew formula (dist/zq.rb) points Homebrew at these artifacts.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for os_arch in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${os_arch%/*}"; arch="${os_arch#*/}"
            out="dist/zq_${VERSION}_${os}_${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "$out" .
            (cd dist && tar czf "zq_${VERSION}_${os}_${arch}.tar.gz" "zq_${VERSION}_${os}_${arch}")
          done
          (cd dist && shasum -a 256 ./*.tar.gz > SHA256SUMS)

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
